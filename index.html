<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <base href="/music-library/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="听见，收藏每一次心动。你的私人音乐曲库。">
  <meta name="theme-color" content="#101b18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="听见">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>听见 · 我的音乐</title>
  <style>
    html,body{height:100%;margin:0;background:#101b18;color:#f3f5ec;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
    #launch{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    #launch img{height:88px;width:88px;border-radius:24px}
    #launch p{margin:0;color:#b9c6bb;font-size:17px}
    #launch strong{font-size:30px;letter-spacing:5px;font-weight:650}
    /* Empty tooltip semantics must not block the canvas beneath them. */
    flt-semantics:empty:not([role]):not([flt-tappable]):not([aria-label]){pointer-events:none!important}
    #launch-error{max-width:300px;text-align:center;line-height:1.7;padding:0 24px}
  </style>
</head>
<body>
  <div id="launch" role="status"><img src="icons/Icon-192.png" alt=""><strong>听见</strong><p id="launch-error">正在打开你的曲库…</p></div>
  <script src="audio_bridge.js?v=c8670dbc273d"></script>
  <script src="flutter_bootstrap.js?v=c8670dbc273d" async></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('music_sw.js').catch(() => {}));
    }
    window.addEventListener('flutter-first-frame', () => document.getElementById('launch')?.remove(), {once:true});
    window.addEventListener('error', event => {
      if (event.target?.tagName === 'SCRIPT') {
        const message = document.getElementById('launch-error');
        if (message) message.textContent = '暂时无法加载，请检查网络后重新打开。';
      }
    }, true);
  </script>
</body>
</html>
