<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/music-library/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Your private music library. Find, save and play music.">
  <meta name="theme-color" content="#f7f8f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="T.Music">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>T.Music</title>
  <style>
    html,body{height:100%;margin:0;background:#f7f8f2;color:#14251c;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}
    #launch{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
    #launch img{height:88px;width:88px;border-radius:24px}
    #launch p{margin:0;color:#48594c;font-size:17px}
    #launch strong{font-size:30px;letter-spacing:5px;font-weight:650}
    /* Empty tooltip semantics must not block the canvas beneath them. */
    flt-semantics:empty:not([role]):not([flt-tappable]):not([aria-label]){pointer-events:none!important}
    #launch-error{max-width:300px;text-align:center;line-height:1.7;padding:0 24px}
  </style>
</head>
<body>
  <div id="launch" role="status"><img src="icons/Icon-192.png" alt=""><strong>T.Music</strong><p id="launch-error">Opening your library…</p></div>
  <script src="audio_bridge.js?v=db10189d7bb7"></script>
  <script src="flutter_bootstrap.js?v=db10189d7bb7" async></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('music_sw.js').catch(() => {}));
    }
    window.addEventListener('flutter-first-frame', () => document.getElementById('launch')?.remove(), {once:true});
    window.addEventListener('error', event => {
      if (event.target?.tagName === 'SCRIPT') {
        const message = document.getElementById('launch-error');
        if (message) message.textContent = 'Unable to load. Check your connection and reload.';
      }
    }, true);
  </script>
</body>
</html>
